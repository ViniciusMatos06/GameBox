services:
  postgres:
    image: postgres:16-alpine
    container_name: gamebox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebox
      POSTGRES_USER: gamebox
      POSTGRES_PASSWORD: gamebox
    ports:
      - "5432:5432"
    volumes:
      - gamebox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: gamebox-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gamebox
      DB_USER: gamebox
      DB_PASSWORD: gamebox
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-change-this-dev-only-secret}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-10080}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      RAWG_API_KEY: ${RAWG_API_KEY:?Defina RAWG_API_KEY no arquivo .env - veja .env.example}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: gamebox-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  gamebox-postgres-data:
