spring:
  application:
    name: gamebox-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gamebox}
    username: ${DB_USER:gamebox}
    password: ${DB_PASSWORD:gamebox}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

gamebox:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-change-this-dev-only-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rawg:
    api-key: ${RAWG_API_KEY:}
    base-url: https://api.rawg.io/api
